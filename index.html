<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Audio HLS</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 320px;
        }

        .player-card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #4caf50;
        }

        audio {
            width: 100%;
            margin-top: 15px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Transmisión en Vivo</h2>
        <p>Radio Sonora</p>
        
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        const streamUrl = 'http://192.168.155.83:8081/sonora/stream_abr/playlist.m3u8';
        const audio = document.getElementById('audioPlayer');

        // Comprobar si el navegador soporta HLS a través de hls.js
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(audio);
        }
        // Soporte nativo para navegadores como Safari (iOS/macOS)
        else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
            audio.src = streamUrl;
        } else {
            alert('Tu navegador no soporta la reproducción de este formato (HLS).');
        }
    </script>

</body>
</html>
