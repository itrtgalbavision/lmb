<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xtrema V6 - Nativo directo</title>
<style>
 body{background:#06090e;color:#fff;font-family:sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}
.card{background:#0e141d;border:1px solid #ffffff14;border-radius:20px;padding:24px;width:100%;max-width:380px;text-align:center}
 button{width:100%;padding:16px;border-radius:100px;border:none;background:#00d9ff;color:#000;font-weight:900;font-size:18px;margin-top:12px}
 #log{background:#0008;padding:10px;border-radius:10px;margin-top:12px;font-family:monospace;font-size:11px;text-align:left;white-space:pre-wrap;min-height:80px}
 audio{width:100%;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h2>Xtrema 101.3 - V6 Nativo</h2>
  <p id="status" style="color:#7de8ff">Nativo directo, sin hls.js</p>
  <button id="playBtn">▶ PLAY XTREMA</button>
  <audio id="audio" controls playsinline preload="auto" crossorigin="anonymous"></audio>
  <div id="log">Log...</div>
  <p style="font-size:11px;color:#64748b;margin-top:10px">Si este no da play, súbelo a tu hosting https:// no lo abras desde Archivos</p>
</div>

<script>
const URL_VIEJO = "https://d2qsan2ut81n2k.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8";
const URL_NUEVO = "https://d2b5h5wyivfnfl.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8";

const audio = document.getElementById('audio');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const playBtn = document.getElementById('playBtn');

function log(m){
  logEl.textContent = new Date().toLocaleTimeString() + " " + m + "\n" + logEl.textContent;
  console.log(m);
}

// Prueba CORS rápido
fetch(URL_VIEJO).then(r=>{
  log(`fetch viejo: ${r.status} ${r.ok?'OK':'FALLO'} CORS: ${r.type}`);
  return r.text();
}).then(t=>log(`manifest viejo ${t.length} chars, primera linea: ${t.split('\n')[0]}`))
.catch(e=>log(`fetch viejo fallo por CORS (normal si es file://): ${e.message}`));

playBtn.onclick = async ()=>{
  try{
    // Usa el viejo primero, tiene menos cortes
    audio.src = URL_VIEJO;
    audio.load();
    statusEl.textContent = "Conectando viejo CDN...";
    log("audio.src = viejo CDN");
    await audio.play();
    log("play() nativo OK");
  }catch(e){
    log(`Nativo viejo fallo: ${e.message} - probando nuevo CDN`);
    try{
      audio.src = URL_NUEVO;
      await audio.play();
      log("play() nuevo CDN OK");
    }catch(e2){
      log(`Ambos fallaron: ${e2.message}`);
      statusEl.textContent = "Súbelo a https:// para probar";
    }
  }
};

audio.addEventListener('playing', ()=>{ statusEl.textContent="EN VIVO - Nativo"; playBtn.textContent="⏸ PAUSA"; log("playing - si se corta aqui es del stream"); });
audio.addEventListener('waiting', ()=>{ log("waiting - buffer bajo"); });
audio.addEventListener('error', (e)=>{ log(`audio error code ${audio.error?audio.error.code:''}`); });
audio.addEventListener('stalled', ()=>log("stalled"));

log("V6 listo. Abierto como: " + location.protocol);
if(location.protocol === 'file:'){
  log("ALERTA: Estas en file:// por eso da manifestLoadError. Sube este html a tu dominio https:// donde tienes la central");
}
</script>
</body>
</html>
