<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test 1 Radio - Fix Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
 body{font-family:Inter,sans-serif;background:#06090e;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{background:#0e141d;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:28px;text-align:center;width:90%;max-width:360px}
.logo{width:80px;height:80px;background:#000;border-radius:14px;display:grid;place-items:center;margin:0 auto 14px;border:1px solid #00d9ff}
.logo img{max-width:80%;max-height:80%}
 button{width:100%;padding:14px;border-radius:100px;border:none;background:#00d9ff;color:#000;font-weight:900;font-size:16px;margin-top:14px}
 #debug{font-size:11px;color:#94a3b8;margin-top:12px;font-family:monospace}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img id="logo" src="galaxia.png" onerror="this.src='https://via.placeholder.com/80'"></div>
  <h2 id="name">Galaxia 88.5 FM</h2>
  <p id="status" style="color:#7de8ff;font-size:13px">Listo para probar</p>
  <button id="playBtn">▶ PLAY</button>
  <div id="debug">Buffer: -- | Latencia: --</div>
</div>

<audio id="audio" preload="auto" playsinline crossorigin="anonymous"></audio>

<script>
const TEST_STATION = {
  name: "Galaxia",
  file: "galaxia.png",
  // Cambia el ID aquí para probar otra radio
  urls: [
    "https://d2b5h5wyivfnfl.cloudfront.net/live/406d6243-a8fc-4215-aca0-ffd43aac2bf3/ts:abr.m3u8",
    "https://d2qsan2ut81n2k.cloudfront.net/live/406d6243-a8fc-4215-aca0-ffd43aac2bf3/ts:abr.m3u8"
  ]
};

const audio = document.getElementById('audio');
const statusEl = document.getElementById('status');
const debugEl = document.getElementById('debug');
const playBtn = document.getElementById('playBtn');
let hls = null;
let currentUrlIndex = 0;
let isPlaying = false;

function getMobileHlsConfig(){
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  return {
    enableWorker: true,
    lowLatencyMode: false,
    backBufferLength: 90,
    maxBufferLength: isMobile? 60 : 30,
    maxMaxBufferLength: 120,
    maxBufferSize: 0, // ilimitado para audio, evita que corte por tamaño
    maxBufferHole: 1.5, // tolera huecos de 1.5s sin re-buffer
    highBufferWatchdogPeriod: 1,
    nudgeOffset: 0.2,
    nudgeMaxRetry: 10,
    liveSyncDurationCount: 6, // antes tenias 3-5, muy agresivo
    liveMaxLatencyDurationCount: Infinity, // no intentes alcanzar el vivo
    liveDurationInfinity: true,
    abrEwmaDefaultEstimate: 600000,
    abrBandWidthFactor: 0.8,
    abrBandWidthUpFactor: 0.7,
    startLevel: 0, // empieza en la calidad más baja, sin cortes
    capLevelToPlayerSize: false,
    manifestLoadingTimeOut: 15000,
    manifestLoadingMaxRetry: 5,
    levelLoadingTimeOut: 15000,
    fragLoadingTimeOut: 25000,
    fragLoadingMaxRetry: 8,
    fragLoadingRetryDelay: 1000,
  };
}

function play(url){
  const finalUrl = url || TEST_STATION.urls[currentUrlIndex];
  statusEl.textContent = "Conectando: " + finalUrl.split('/')[2];

  if(hls){ try{hls.destroy()}catch(e){} hls=null; }

  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const canNative = audio.canPlayType('application/vnd.apple.mpegurl');

  // iOS - Nativo es SIEMPRE más estable
  if(isIOS || canNative){
    console.log("Usando nativo");
    audio.src = finalUrl;
    audio.load();
    audio.play().catch(e=>{ statusEl.textContent = "Toca PLAY de nuevo (iOS bloquea autoplay)"; });
    return;
  }

  // Android / PC - HLS.js con fix
  if(Hls.isSupported()){
    hls = new Hls(getMobileHlsConfig());
    hls.loadSource(finalUrl);
    hls.attachMedia(audio);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      console.log("Manifest ok, levels:", hls.levels.length);
      audio.play().catch(()=>{});
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      console.warn("HLS Error", data.type, data.details, data.fatal);
      if(!data.fatal) return;

      if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
        statusEl.textContent = "Reconectando red...";
        hls.startLoad();
      } else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
        statusEl.textContent = "Recuperando audio...";
        hls.recoverMediaError();
      } else {
        // Fatal real, probamos el otro CDN
        if(currentUrlIndex + 1 < TEST_STATION.urls.length){
          currentUrlIndex++;
          statusEl.textContent = "Probando CDN alterno...";
          play(TEST_STATION.urls[currentUrlIndex]);
        } else {
          statusEl.textContent = "Error de señal";
        }
      }
    });

  } else {
    audio.src = finalUrl;
    audio.play();
  }
}

// Eventos del <audio> para celular
audio.addEventListener('playing', ()=>{ isPlaying=true; playBtn.textContent="⏸ PAUSA"; statusEl.textContent="EN VIVO • Sonando"; });
audio.addEventListener('pause', ()=>{ isPlaying=false; playBtn.textContent="▶ PLAY"; statusEl.textContent="Pausado"; });
audio.addEventListener('waiting', ()=>{ statusEl.textContent="Buffering..."; });
audio.addEventListener('stalled', ()=>{
  console.log("Stalled detectado, forzando carga");
  if(hls) hls.startLoad();
});

// Si el usuario bloquea la pantalla y vuelve, reanuda
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && isPlaying && audio.paused){
    audio.play().catch(()=>{});
  }
});

playBtn.addEventListener('click', ()=>{
  if(!isPlaying){
    if(!audio.src) play();
    else audio.play();
  } else {
    audio.pause();
  }
});

// Debug de buffer cada segundo
setInterval(()=>{
  if(audio.buffered.length){
    const bufferedEnd = audio.buffered.end(audio.buffered.length-1);
    const current = audio.currentTime;
    const buf = (bufferedEnd - current).toFixed(1);
    const latency = hls? (hls.liveSyncPosition? (bufferedEnd - hls.liveSyncPosition).toFixed(1) : '--') : '--';
    debugEl.textContent = `Buffer: ${buf}s | Estado: ${statusEl.textContent}`;
  }
}, 1000);

</script>
</body>
</html>
