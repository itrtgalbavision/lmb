<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sonora</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.player{
    width:350px;
    padding:30px;
    background:#222;
    border-radius:20px;
    text-align:center;
}

button{
    width:80px;
    height:80px;
    border:0;
    border-radius:50%;
    font-size:30px;
    cursor:pointer;
}

#estado{
    margin:20px 0;
    color:#aaa;
}
</style>

</head>

<body>

<div class="player">

```
<h2>📻 RADIO SONORA</h2>

<div id="estado">
    Preparando...
</div>

<button id="play">
    ▶
</button>

<br><br>

<input
    id="volumen"
    type="range"
    min="0"
    max="1"
    step="0.01"
    value="1">

<audio id="audio" controls></audio>
```

</div>

<script>

const URL_STREAM =
"http://190.56.85.14:8081/sonora/stream_abr/playlist.m3u8";

const audio =
document.getElementById("audio");

const boton =
document.getElementById("play");

const estado =
document.getElementById("estado");

const volumen =
document.getElementById("volumen");


/* VOLUMEN */

audio.volume = 1;

volumen.addEventListener("input", () => {

    audio.volume =
        volumen.value;

});


/* HLS */

let hls;


if (Hls.isSupported()) {

    console.log("HLS.js soportado");

    hls = new Hls({

        enableWorker: true,

        lowLatencyMode: false,

        debug: true

    });

    hls.loadSource(URL_STREAM);

    hls.attachMedia(audio);


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

            console.log(
                "M3U8 cargado correctamente"
            );

            estado.innerHTML =
                "🟢 STREAM DISPONIBLE";

        }
    );


    hls.on(
        Hls.Events.ERROR,
        function(event, data){

            console.error(
                "HLS ERROR:",
                data
            );

            estado.innerHTML =
                "🔴 Error HLS: " +
                data.details;

        }
    );

}


/* Safari */

else if (
    audio.canPlayType(
        "application/vnd.apple.mpegurl"
    )
) {

    audio.src = URL_STREAM;

}


/* PLAY */

boton.addEventListener(
    "click",
    async function(){

        try{

            if(audio.paused){

                await audio.play();

                boton.innerHTML = "⏸";

                estado.innerHTML =
                    "🟢 REPRODUCIENDO";

            }else{

                audio.pause();

                boton.innerHTML = "▶";

                estado.innerHTML =
                    "⏹ PAUSADO";

            }

        }catch(error){

            console.error(error);

            estado.innerHTML =
                "🔴 " + error.message;

        }

    }
);

</script>

</body>
</html>
