<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xtrema V4 - Shaka Estable</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
<style>
 body{background:#06090e;color:#fff;font-family:sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}
.card{background:#0e141d;border:1px solid #ffffff14;border-radius:20px;padding:24px;width:100%;max-width:400px;text-align:center}
button{width:100%;padding:16px;border-radius:100px;border:none;background:#00d9ff;color:#000;font-weight:900;font-size:18px;cursor:pointer}
#log{background:#0008;padding:10px;border-radius:10px;margin-top:12px;font-family:monospace;font-size:11px;text-align:left;white-space:pre-wrap;min-height:100px;max-height:200px;overflow:auto}
</style>
</head>
<body>
<div class="card">
  <h2>Xtrema 101.3 - V4 SHAKA</h2>
  <p id="status" style="color:#7de8ff;font-size:13px">Toca PLAY - Modo 30s delay</p>
  <button id="playBtn">▶ PLAY SIN CORTES</button>
  <div id="log">Log...</div>
</div>
<audio id="audio" playsinline></audio>

<script>
const URL = "https://d2b5h5wyivfnfl.cloudfront.net/live/c2cce928-c69c-45d5-bd0a-5a5eba167a0d/ts:abr.m3u8";
const audio = document.getElementById('audio');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const playBtn = document.getElementById('playBtn');
let player = null;
let isPlaying = false;

function log(m){
  console.log(m);
  logEl.textContent = new Date().toLocaleTimeString() + " " + m + "\n" + logEl.textContent;
}

async function initShaka(){
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){
    log("Shaka no soportado, fallback a nativo");
    audio.src = URL;
    audio.play();
    return;
  }

  player = new shaka.Player(audio);

  // CONFIGURACION PARA RADIO EN CELULAR - lo mas estable
  player.configure({
    streaming: {
      bufferingGoal: 90, // quiere 90s de buffer
      rebufferingGoal: 15, // si se queda sin buffer, espera 15s antes de dar play
      bufferBehind: 30,
      retryParameters: { maxAttempts: 10, baseDelay: 1000, backoffFactor: 2 },
      // no intentes estar pegado al vivo, atrasate 30s
      liveSync: false,
      inaccurateManifestTolerance: 0,
      maxDisabledTime: 30,
    },
    manifest: {
      dash: { ignoreMinBufferTime: true },
      hls: { ignoreMinBufferTime: true }
    },
    abr: {
      enabled: true,
      defaultBandwidthEstimate: 200000, // empieza bajo
      switchInterval: 15, // no cambies cada 2s, cambia cada 15s
      bandwidthUpgradeTarget: 0.7,
      bandwidthDowngradeTarget: 0.9,
    }
  });

  player.addEventListener('error', e=>{
    log("Shaka error: " + e.detail.code + " " + e.detail.message);
  });

  player.addEventListener('buffering', e=>{
    log(e.detail.buffering? "BUFFERING..." : "Buffer OK");
    statusEl.textContent = e.detail.buffering? "Buffering..." : "EN VIVO - Buffer grande";
  });

  try{
    log("Cargando " + URL);
    statusEl.textContent = "Cargando con 30s delay...";
    await player.load(URL);
    log("Load OK - pistas: " + player.getVariantTracks().length);

    // Forza la calidad mas baja al inicio
    const tracks = player.getVariantTracks().filter(t=>t.mimeType.includes('audio') || t.type==='variant');
    if(tracks.length){
      tracks.sort((a,b)=>a.bandwidth - b.bandwidth);
      const lowest = tracks[0];
      log(`Forzando track baja: ${Math.round(lowest.bandwidth/1000)}k id=${lowest.id}`);
      player.configure({abr: {enabled: false}}); // desactiva ABR despues de cargar
      player.selectVariantTrack(lowest, true);
    }

    await audio.play();
    log("Play OK");
  }catch(err){
    log("Error load: " + err.code + " " + err.message);
    // ultimo fallback nativo puro
    log("Fallback a audio.src nativo");
    audio.src = URL;
    audio.play().catch(e=>log("Nativo tambien fallo: "+e.message));
  }
}

playBtn.onclick = async ()=>{
  if(!isPlaying){
    if(!player &&!audio.src){
      await initShaka();
    } else {
      audio.play();
    }
  } else {
    audio.pause();
  }
};

audio.addEventListener('playing', ()=>{ isPlaying=true; playBtn.textContent="⏸ PAUSA"; statusEl.textContent="EN VIVO - 30s delay (estable)"; log("playing"); });
audio.addEventListener('pause', ()=>{ isPlaying=false; playBtn.textContent="▶ PLAY SIN CORTES"; log("pause"); });
audio.addEventListener('stalled', ()=>log("stalled"));
audio.addEventListener('waiting', ()=>log("waiting"));

log("V4 listo - " + navigator.userAgent.substring(0,70));
</script>
</body>
</html>
