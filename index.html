<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Sonora - En Vivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 320px;
        }

        .player-card h2 {
            margin-top: 0;
            color: #4caf50;
        }

        /* Ocultamos el iframe y mostramos solo el reproductor nativo */
        .stream-frame {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            background-color: #2a2a2a;
        }

        .btn-direct {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn-direct:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Radio Sonora</h2>
        <p style="margin: 5px 0; color: #aaa;">Transmisión en Vivo</p>

        <!-- Método 1: Embebido directo en marco aislado (evita el bloqueo del Play) -->
        <iframe class="stream-frame" src="http://190.56.85.14:8081/sonora/stream_abr/playlist.m3u8"></iframe>

        <p style="font-size: 0.8rem; color: #888; margin-top: 15px;">
            Si el marco anterior aparece en blanco en tu navegador:
        </p>

        <!-- Método 2: Botón de emisión limpia directa -->
        <a href="http://190.56.85.14:8081/sonora/stream_abr/playlist.m3u8" target="_blank" class="btn-direct">
            ▶ Escuchar en Vivo
        </a>
    </div>

</body>
</html>
