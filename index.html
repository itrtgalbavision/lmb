<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Streams CENTRAL DE RADIOS</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                radial-gradient(
                    circle at top,
                    #1c2633 0%,
                    #0d1117 45%,
                    #080b0f 100%
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

        }


        .container {

            width: 92%;

            max-width: 760px;

            padding: 35px;

            background:
                rgba(22, 27, 34, 0.94);

            border:
                1px solid #30363d;

            border-radius: 20px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.55);

        }


        h1 {

            text-align: center;

            margin: 0;

            font-size: 30px;

            letter-spacing: 1px;

        }


        .subtitle {

            text-align: center;

            color: #8b949e;

            margin-top: 8px;

            margin-bottom: 30px;

            font-size: 14px;

        }


        .streams {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 16px;

        }


        .stream {

            position: relative;

            display: flex;

            align-items: center;

            min-height: 95px;

            padding: 15px 18px;

            background:
                linear-gradient(
                    145deg,
                    #21262d,
                    #171b21
                );

            border:
                1px solid #30363d;

            border-radius: 15px;

            color: white;

            cursor: pointer;

            overflow: hidden;

            transition:
                transform .25s,
                border-color .25s,
                box-shadow .25s;

        }


        .stream::before {

            content: "";

            position: absolute;

            left: 0;

            top: 0;

            bottom: 0;

            width: 3px;

            background: #3fb950;

        }


        .stream:hover {

            transform:
                translateY(-4px);

            border-color:
                #58a6ff;

            box-shadow:
                0 12px 30px
                rgba(0,0,0,.35);

        }


        .radio-icon {

            width: 65px;

            height: 65px;

            flex-shrink: 0;

            object-fit: contain;

            margin-right: 16px;

            border-radius: 12px;

            background: #0d1117;

            padding: 5px;

            border:
                1px solid #30363d;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,.35);

        }


        .info {

            flex: 1;

        }


        .name {

            display: block;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 6px;

        }


        .type {

            display: block;

            color: #8b949e;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

        }


        .status {

            width: 10px;

            height: 10px;

            flex-shrink: 0;

            margin-left: 10px;

            background: #3fb950;

            border-radius: 50%;

            box-shadow:
                0 0 8px
                rgba(63,185,80,.8);

            animation:
                pulse 2s infinite;

        }


        @keyframes pulse {

            0% {
                box-shadow:
                    0 0 5px
                    rgba(63,185,80,.5);
            }

            50% {
                box-shadow:
                    0 0 14px
                    rgba(63,185,80,.9);
            }

            100% {
                box-shadow:
                    0 0 5px
                    rgba(63,185,80,.5);
            }

        }


        .footer {

            margin-top: 25px;

            text-align: center;

            color: #6e7681;

            font-size: 12px;

        }


        @media (max-width: 600px) {

            body {

                align-items:
                    flex-start;

                padding-top: 25px;

            }


            .container {

                width: 94%;

                padding:
                    25px 18px;

            }


            h1 {

                font-size: 23px;

            }


            .streams {

                grid-template-columns: 1fr;

                gap: 12px;

            }


            .stream {

                min-height: 82px;

                padding:
                    12px 14px;

            }


            .radio-icon {

                width: 55px;

                height: 55px;

                margin-right: 13px;

            }


            .name {

                font-size: 16px;

            }

        }

    </style>

</head>


<body>

    <script>

        function abrirStream(url, nombre) {


            /*
             * Detectamos si estamos en celular
             */

            const movil =
                /Android|iPhone|iPad|iPod/i
                .test(navigator.userAgent);


            /*
             * CELULAR
             *
             * Abrimos directamente el M3U8.
             * Esto permite que el sistema/navegador
             * utilice su reproductor compatible.
             */

            if (movil) {

                window.location.href = url;

                return;

            }


            /*
             * PC
             *
             * Abrimos una ventana independiente.
             */

            const ancho = 900;

            const alto = 600;


            const izquierda =
                Math.max(
                    0,
                    (screen.width - ancho) / 2
                );


            const arriba =
                Math.max(
                    0,
                    (screen.height - alto) / 2
                );


            const opciones =

                "width=" + ancho +
                ",height=" + alto +
                ",left=" + izquierda +
                ",top=" + arriba +
                ",resizable=yes" +
                ",scrollbars=yes" +
                ",toolbar=no" +
                ",menubar=no";


            const ventana =

                window.open(
                    url,
                    "radio_" + nombre.replace(/\s/g, "_"),
                    opciones
                );


            if (ventana) {

                ventana.focus();

            }

            else {

                alert(
                    "El navegador bloqueó la ventana emergente.\n\n" +
                    "Permite las ventanas emergentes para este sitio."
                );

            }

        }

    </script>
