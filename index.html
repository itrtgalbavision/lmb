<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Sonora - En Vivo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 320px;
        }

        .player-card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #4caf50;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        .option-group {
            margin-top: 15px;
            text-align: left;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
        }

        label {
            font-size: 0.85rem;
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Transmisión en Vivo</h2>
        <p style="margin: 5px 0 15px 0;">Radio Sonora</p>

        <!-- Reproductor Principal -->
        <audio id="mainPlayer" controls autoplay></audio>

        <div class="option-group">
            <label for="streamSelect">Si no se escucha, cambia de señal:</label>
            <select id="streamSelect" style="width: 100%; padding: 8px; border-radius: 4px; background: #333; color: white; border: 1px solid #555;">
                <option value="http://192.168.155.83:8081/sonora/stream_abr/playlist.m3u8">Señal 1: playlist.m3u8</option>
                <option value="http://192.168.155.83:8081/sonora">Señal 2: /sonora (Directo)</option>
                <option value="http://192.168.155.83:8081/sonora/stream">Señal 3: /sonora/stream</option>
                <option value="http://192.168.155.83:8081/sonora.mp3">Señal 4: /sonora.mp3</option>
                <option value="http://192.168.155.83:8081/stream">Señal 5: /stream</option>
            </select>
        </div>
    </div>

    <script>
        const player = document.getElementById('mainPlayer');
        const selector = document.getElementById('streamSelect');

        // Establecer fuente inicial
        player.src = selector.value;

        // Cambiar fuente al seleccionar
        selector.addEventListener('change', (e) => {
            player.src = e.target.value;
            player.play();
        });
    </script>

</body>
</html>
