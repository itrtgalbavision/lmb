<style>
:root{--bg-deep:#06090e;--bg-surface:#0e141d;--bg-card:rgba(14,20,29,0.6);--border:rgba(255,255,255,0.06);--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#475569;--radius-xl:18px;--font-sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100vh;background:var(--bg-deep)}body{font-family:var(--font-sans);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#ambientGlow{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:0;transition:opacity 0.8s ease, background 0.8s ease;background:radial-gradient(600px 400px at 50% -10%, var(--glow, rgba(0,217,255,0.12)), transparent 70%), radial-gradient(800px 600px at 100% 100%, var(--glow2, rgba(255,0,170,0.06)), transparent 60%);filter:blur(20px)}#ambientGlow.on{opacity:1}
.wrap{max-width:1200px;margin:0 auto;padding:40px 20px 170px}
.site-header{text-align:center;margin-bottom:36px}.live-badge{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:0.22em;color:#ff99aa;background:rgba(255,51,85,0.08);border:1px solid rgba(255,51,85,0.18);padding:5px 14px;border-radius:100px;margin-bottom:12px;text-transform:uppercase}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ff3355;box-shadow:0 0 8px #ff3355;animation:pulseDot 1.4s ease-in-out infinite}@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.8)}}
.online-counter{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:0.08em;color:#7de8ff;background:rgba(0,217,255,0.08);border:1px solid rgba(0,217,255,0.22);padding:5px 14px;border-radius:100px;margin-bottom:12px;margin-left:8px;box-shadow:0 0 12px rgba(0,217,255,0.15)}
.online-dot{width:6px;height:6px;border-radius:50%;background:#00d9ff;box-shadow:0 0 8px #00d9ff;animation:pulseDotCyan 1.6s infinite}
@keyframes pulseDotCyan{0%,100%{opacity:1;box-shadow:0 0 6px #00d9ff}50%{opacity:0.6;box-shadow:0 0 12px #00d9ff}}
#onlineCount{font-weight:900;color:#fff;text-shadow:0 0 8px rgba(0,217,255,0.5);min-width:28px;display:inline-block;transition:transform 0.25s}
#onlineCount.bump{transform:scale(1.18)}
.header-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-bottom:4px}
.site-title{font-size:clamp(28px,4.5vw,48px);font-weight:900;line-height:1.05;letter-spacing:-0.03em;text-transform:uppercase}.site-title .thin{color:var(--text-muted);font-weight:700;display:block;font-size:0.55em;letter-spacing:0.08em}.site-title .grad{background:linear-gradient(135deg,#ffffff 40%, #8be9ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.site-subtitle{margin-top:8px;color:var(--text-secondary);font-size:13px}
.controls-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px;background:var(--bg-surface);border:1px solid var(--border);padding:8px;border-radius:14px}
.search-wrap{position:relative;flex:1 1 280px}.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);width:16px;height:16px}.search-input{width:100%;background:rgba(0,0,0,0.2);border:1px solid var(--border);color:var(--text-primary);border-radius:10px;padding:10px 14px 10px 40px;font-size:13px;outline:none}.search-input:focus{border-color:rgba(0,217,255,0.4);box-shadow:0 0 0 3px rgba(0,217,255,0.12)}
.view-controls{display:flex;gap:6px;align-items:center}.view-btn,.fav-toggle{border:1px solid var(--border);background:rgba(255,255,255,0.02);color:var(--text-secondary);font-size:12px;font-weight:600;padding:8px 14px;border-radius:10px;transition:all 0.2s}.view-btn.active{border-color:rgba(0,217,255,0.4);background:rgba(0,217,255,0.08);color:#7de8ff}.fav-toggle.on{border-color:rgba(255,183,0,0.35);background:rgba(255,183,0,0.08);color:#ffcc66}
.list-meta{color:var(--text-muted);font-size:11px;font-weight:600;margin:0 0 14px 4px;text-transform:uppercase;letter-spacing:0.06em}
.stations-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.station-card{--neon:#00d9ff;--neon-border:rgba(0,217,255,0.28);--neon-soft:rgba(0,217,255,0.12);--neon-glow:rgba(0,217,255,0.5);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.15)), var(--bg-card);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 12px;cursor:pointer;transition:all 0.28s ease;position:relative}
.station-card:hover{border-color:var(--neon-border);transform:translateY(-2px)}.station-card.active{border-color:var(--neon-border);box-shadow:0 0 0 1px var(--neon-border) inset}
.card-logo-wrap{width:100%;height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:rgba(0,0,0,0.28);border-radius:11px;position:relative;overflow:hidden;border:1px solid var(--neon-border);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);transition:all 0.35s ease}
.station-card.active .card-logo-wrap{border-color:var(--neon);box-shadow:0 0 14px var(--neon-soft), 0 0 0 1px var(--neon-border) inset;animation:neonBreathe 2.8s ease-in-out infinite alternate}

.card-logo-wrap img{max-width:66%;max-height:74%;object-fit:contain;filter:drop-shadow(0 0 4px var(--neon-soft)) brightness(1.02);transition:all 0.35s ease}
.card-name{font-size:13px;font-weight:700;color:#e8eef6;text-align:center}.card-freq{font-size:10.5px;font-weight:600;color:var(--text-secondary);margin-top:3px}.station-card:hover .card-freq,.station-card.active .card-freq{color:var(--neon)}
.card-fav-btn{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--text-muted);z-index:2}
.stations-list{display:flex;flex-direction:column;gap:8px}.list-row{--neon:#00d9ff;--neon-border:rgba(0,217,255,0.28);--neon-soft:rgba(0,217,255,0.12);display:flex;align-items:center;gap:12px;background:var(--bg-card);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:8px 14px;cursor:pointer}
.list-row.active{border-color:var(--neon-border)}.list-logo{width:42px;height:32px;display:grid;place-items:center;flex-shrink:0;background:rgba(0,0,0,0.32);border:1px solid var(--neon-border);border-radius:8px;padding:3px}.list-logo img{max-width:100%;max-height:100%;object-fit:contain}
.list-info{flex:1}.list-name{font-weight:700;font-size:13.5px}.list-freq{font-size:11px;color:var(--text-secondary)}.list-actions{display:flex;align-items:center;gap:8px}.list-play{width:28px;height:28px;border-radius:50%;border:1px solid var(--neon-border);color:var(--neon);display:grid;place-items:center;font-size:10px}
.stations-compact{display:flex;flex-wrap:wrap;gap:8px}.compact-pill{--neon:#00d9ff;--neon-border:rgba(0,217,255,0.28);--neon-soft:rgba(0,217,255,0.12);display:inline-flex;align-items:center;gap:8px;background:rgba(14,20,29,0.6);border:1px solid var(--neon-border);border-radius:100px;padding:6px 14px 6px 8px;cursor:pointer;font-size:12px;font-weight:600;color:#cbd5e1}.compact-pill.active{background:var(--neon);color:#000}
.player-bar{position:fixed;left:12px;right:12px;bottom:12px;max-width:1360px;margin:0 auto;background:rgba(10,15,23,0.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.10);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.06) inset;z-index:100;overflow:hidden;--player-neon:#00d9ff;--player-neon-soft:rgba(0,217,255,0.18);--player-neon-border:rgba(0,217,255,0.32)}
.rainbow-line{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ffe600,#ff6a00,#ff00aa,#9d00ff,#00d9ff,#39ff14,#ffe600);background-size:300% 100%;opacity:0.9;transition:opacity 0.4s;z-index:5}
.player-bar.playing .rainbow-line{animation:rainbowShift 3s linear infinite;box-shadow:0 2px 12px rgba(0,217,255,0.4)}
@keyframes rainbowShift{0%{background-position:0% 0%}100%{background-position:300% 0%}}
.player-inner{padding:12px 18px 10px;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:16px;position:relative;z-index:2}
.player-left{display:flex;align-items:center;gap:12px;min-width:0}.player-logo{width:48px;height:48px;background:radial-gradient(ellipse at center, rgba(255,255,255,0.08), rgba(0,0,0,0.6));border:2px solid var(--player-neon);border-radius:12px;display:grid;place-items:center;flex-shrink:0;padding:5px;box-shadow:0 0 14px var(--player-neon-soft), 0 0 28px var(--player-neon-soft), inset 0 0 10px rgba(0,0,0,0.6);transition:all 0.5s ease;position:relative}
.player-logo::after{content:'';position:absolute;inset:-10px;border-radius:16px;background:var(--player-neon);filter:blur(18px);opacity:0.28;z-index:-1;transition:opacity 0.5s}
.player-bar.playing .player-logo{animation:logoPulse 1.2s infinite alternate;box-shadow:0 0 18px var(--player-neon), 0 0 32px var(--player-neon-soft)}
.player-bar.playing .player-logo::after{opacity:0.55}
@keyframes logoPulse{0%{box-shadow:0 0 12px var(--player-neon-soft), 0 0 20px var(--player-neon-soft)}100%{box-shadow:0 0 20px var(--player-neon), 0 0 40px var(--player-neon-soft), 0 0 60px var(--player-neon-soft)}}
.player-logo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 8px var(--player-neon-soft)) brightness(1.15)}
.player-meta{min-width:0}.player-station{font-weight:800;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 12px rgba(255,255,255,0.15)}.player-live{font-size:11px;font-weight:700;color:var(--text-muted);display:flex;align-items:center;gap:8px;margin-top:3px;letter-spacing:0.04em}.p-live-dot{width:5px;height:5px;border-radius:50%;background:var(--text-muted)}.player-bar.playing .p-live-dot{background:#ff3355;box-shadow:0 0 6px #ff3355;animation:pulseDot 1.4s infinite}
.visualizer{display:flex;align-items:flex-end;gap:3px;height:18px;padding:3px 7px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.06);border-radius:6px;box-shadow:inset 0 1px 2px rgba(0,0,0,0.5)}.vbar{width:3px;height:4px;background:var(--text-muted);border-radius:2px;transition:all 0.15s ease}.player-bar.playing .vbar{background:var(--player-neon);box-shadow:0 0 6px var(--player-neon-soft)}
.player-bar.playing .vbar:nth-child(1){animation:waveAnim 0.7s infinite alternate 0.05s}.player-bar.playing .vbar:nth-child(2){animation:waveAnim 0.5s infinite alternate 0.2s}.player-bar.playing .vbar:nth-child(3){animation:waveAnim 0.9s infinite alternate 0.1s}.player-bar.playing .vbar:nth-child(4){animation:waveAnim 0.6s infinite alternate 0.3s}.player-bar.playing .vbar:nth-child(5){animation:waveAnim 0.8s infinite alternate 0.15s}.player-bar.playing .vbar:nth-child(6){animation:waveAnim 0.5s infinite alternate 0.25s}.player-bar.playing .vbar:nth-child(7){animation:waveAnim 0.7s infinite alternate 0s}.player-bar.playing .vbar:nth-child(8){animation:waveAnim 0.6s infinite alternate 0.35s}@keyframes waveAnim{0%{height:4px;opacity:0.4}100%{height:16px;opacity:1}}
.player-center{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:18px;justify-items:center;min-width:600px}
.controls-group{display:flex;align-items:center;gap:10px;justify-content:center;justify-self:center;grid-column:2;z-index:3;background:rgba(0,0,0,0.22);border:1px solid rgba(255,255,255,0.08);border-radius:100px;padding:6px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 14px rgba(0,0,0,0.4)}
.ctrl-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);color:var(--text-primary);transition:all 0.22s;z-index:2}
.ctrl-btn:hover{background:rgba(255,255,255,0.12);transform:scale(1.08);border-color:rgba(255,255,255,0.18)}
.ctrl-btn.play{width:48px;height:48px;background:#00d9ff;color:#000;border:none;box-shadow:0 0 18px rgba(0,217,255,0.6), 0 0 0 1px rgba(255,255,255,0.2) inset;animation:playGlow 1.4s infinite alternate}
@keyframes playGlow{0%{box-shadow:0 0 14px rgba(0,217,255,0.5), 0 0 0 1px rgba(255,255,255,0.15) inset}100%{box-shadow:0 0 26px rgba(0,217,255,0.9), 0 0 46px rgba(0,217,255,0.4), 0 0 0 1px rgba(255,255,255,0.25) inset}}
.player-bar.playing .ctrl-btn.play{background:var(--player-neon)}
.dancers-stage{display:flex;align-items:flex-end;gap:6px;height:58px;pointer-events:none;user-select:none;position:relative;opacity:1}
.dancers-stage.left{justify-content:flex-end;grid-column:1;justify-self:end}
.dancers-stage.right{justify-content:flex-start;grid-column:3;justify-self:start}
.dancers-stage::after{content:'';position:absolute;bottom:-6px;left:-8px;right:-8px;height:20px;background:radial-gradient(ellipse at center,var(--glow-color,rgba(0,217,255,0.22)),transparent 70%);filter:blur(8px);opacity:0.55}
.dancers-stage.left{--glow-color:rgba(0,217,255,0.22)}.dancers-stage.right{--glow-color:rgba(255,0,170,0.20)}
.inflatable-wrapper{width:30px;height:52px;position:relative;transform-origin:bottom center;transition:transform 0.5s, opacity 0.5s;opacity:0.85;transform:scaleY(0.86);flex-shrink:0;z-index:2}
.inflatable-svg{width:100%;height:100%;overflow:visible}
.neon-cyan{color:#00d9ff;filter:drop-shadow(0 0 6px #00d9ff) drop-shadow(0 0 14px rgba(0,217,255,0.7)) drop-shadow(0 0 22px rgba(0,217,255,0.4))}
.neon-lime{color:#8aff4d;filter:drop-shadow(0 0 6px #8aff4d) drop-shadow(0 0 14px rgba(138,255,77,0.6)) drop-shadow(0 0 20px rgba(138,255,77,0.3))}
.neon-violet{color:#b07cff;filter:drop-shadow(0 0 6px #b07cff) drop-shadow(0 0 14px rgba(176,124,255,0.6)) drop-shadow(0 0 20px rgba(176,124,255,0.3))}
.neon-yellow{color:#ffe066;filter:drop-shadow(0 0 6px #ffe066) drop-shadow(0 0 14px rgba(255,224,102,0.6)) drop-shadow(0 0 20px rgba(255,224,102,0.3))}
.player-bar.playing .inflatable-wrapper{opacity:1}
.player-bar.playing .dancer-1{animation:danceA 0.68s infinite alternate ease-in-out}.player-bar.playing .dancer-2{animation:danceB 0.64s infinite alternate ease-in-out 0.08s}.player-bar.playing .dancer-6{animation:danceA 0.68s infinite alternate ease-in-out 0.18s}.player-bar.playing .dancer-10{animation:danceB 0.68s infinite alternate ease-in-out 0.10s}
.player-bar.playing .arm{transform-origin:16px 18px}.player-bar.playing .arm-l{animation:armFlail 0.36s infinite alternate ease-in-out}.player-bar.playing .arm-r{animation:armFlailRev 0.40s infinite alternate ease-in-out}
@keyframes danceA{0%{transform:scaleY(0.82) skewX(-12deg) rotate(-7deg) translateY(3px)}100%{transform:scaleY(1.20) skewX(11deg) rotate(8deg) translateY(-3px)}}
@keyframes danceB{0%{transform:scaleY(1.14) skewX(10deg) rotate(7deg) translateY(-2px)}100%{transform:scaleY(0.82) skewX(-10deg) rotate(-7deg) translateY(3px)}}
@keyframes armFlail{0%{transform:rotate(-42deg) scaleY(0.85)}100%{transform:rotate(52deg) scaleY(1.15)}}
@keyframes armFlailRev{0%{transform:rotate(46deg) scaleY(1.1)}100%{transform:rotate(-46deg) scaleY(0.88)}}
.player-right{display:flex;align-items:center;justify-content:flex-end;min-width:180px}
.vol-wrap{display:flex;align-items:center;gap:0;background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(0,0,0,0.45));border:1px solid var(--player-neon-border);border-radius:100px;padding:5px 8px 5px 5px;box-shadow:0 0 0 1px rgba(0,0,0,0.5) inset, 0 0 16px var(--player-neon-soft), inset 0 1px 0 rgba(255,255,255,0.08);transition:all 0.35s ease;position:relative}
.vol-wrap:hover{border-color:var(--player-neon);box-shadow:0 0 0 1px var(--player-neon-border) inset, 0 0 22px var(--player-neon-soft)}
.vol-wrap::before{content:'';position:absolute;inset:-8px;border-radius:100px;background:var(--player-neon);filter:blur(16px);opacity:0.12;transition:opacity 0.35s;z-index:-1}
.vol-wrap:hover::before{opacity:0.22}
.vol-icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.10);color:var(--player-neon);cursor:pointer;flex-shrink:0;transition:all 0.25s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,0.10), 0 2px 6px rgba(0,0,0,0.3)}
.vol-icon-btn:hover{background:var(--player-neon);color:#000;border-color:var(--player-neon);box-shadow:0 0 14px var(--player-neon-soft);transform:scale(1.05)}
.vol-icon-btn.muted{color:#ff6b6b;background:rgba(255,80,80,0.12);border-color:rgba(255,80,80,0.25)}
.vol-slider-wrap{display:flex;align-items:center;gap:10px;width:124px;opacity:1;margin-left:10px;margin-right:4px}
.vol-track{-webkit-appearance:none;appearance:none;width:84px;height:5px;border-radius:3px;background:linear-gradient(to right, var(--player-neon) 0%, var(--player-neon) var(--vol-p, 100%), rgba(255,255,255,0.14) var(--vol-p, 100%), rgba(255,255,255,0.14) 100%);outline:none;cursor:pointer}
.vol-track::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--player-neon);border:2px solid #0a0f17;box-shadow:0 0 0 1px var(--player-neon-border), 0 0 12px var(--player-neon), 0 2px 8px rgba(0,0,0,0.6);transition:all 0.2s;cursor:pointer}
.vol-track::-webkit-slider-thumb:hover{transform:scale(1.25);box-shadow:0 0 0 2px var(--player-neon-border), 0 0 20px var(--player-neon)}
.vol-pct{font-size:11px;font-weight:800;color:var(--player-neon);min-width:32px;text-align:right;letter-spacing:0.03em;text-shadow:0 0 10px var(--player-neon-soft);font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(8px);background:#0f172a;border:1px solid rgba(255,255,255,0.1);color:#fff;padding:7px 13px;border-radius:100px;font-size:11px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.45);z-index:120;opacity:0;pointer-events:none;transition:all 0.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty-state{background:var(--bg-card);border:1px dashed var(--border);border-radius:12px;padding:36px 20px;text-align:center;color:var(--text-secondary);font-size:13px}
.hidden{display:none !important}
@media (max-width:1200px){.player-center{min-width:480px}.player-right{min-width:160px}.vol-slider-wrap{width:100px}.vol-track{width:68px}}
@media (max-width:980px){.player-inner{grid-template-columns:1fr auto}.player-center{min-width:auto}.dancers-stage.left{display:none}.player-right{display:flex;min-width:44px}.vol-slider-wrap{display:none}.vol-wrap{padding:5px}}
@media (max-width:768px){.controls-bar{flex-direction:column;align-items:stretch}.view-controls{justify-content:space-between}.wrap{padding-bottom:190px}.player-bar{left:8px;right:8px;bottom:8px}.player-center{grid-template-columns:1fr auto 1fr;min-width:auto;gap:6px}.dancers-stage.left{display:flex}.dancers-stage.left .inflatable-wrapper:nth-child(n+2),.dancers-stage.right .inflatable-wrapper:nth-child(n+2){display:none}.player-right{display:none}}
@media (max-width:480px){.dancers-stage.left,.dancers-stage.right{display:none}.player-center{grid-template-columns:1fr;justify-items:center}.dancers-stage{display:none !important}.controls-group{grid-column:1}}
</style>
</head>

<div class="wrap">

let onlineBase = 0;
function initOnlineCounter(){
  const hour = new Date().getHours();
  let base = 180;
  if(hour >= 7 && hour <= 9) base = 280;
  else if(hour >= 12 && hour <= 14) base = 320;
  else if(hour >= 17 && hour <= 21) base = 380;
  else if(hour >= 22 || hour <= 5) base = 140;
  onlineBase = base + Math.floor(Math.random()*60) - 10;
  updateOnlineDisplay();
  setInterval(()=>{
    const delta = Math.floor(Math.random()*7) - 2; // -2 a +4
    onlineBase = Math.max(65, onlineBase + delta);
    updateOnlineDisplay(true);
  }, 3200);
  setInterval(()=>{
    // picos ocasionales cuando alguien cambia de radio
    if(Math.random() > 0.7){
      onlineBase += Math.floor(Math.random()*6)+1;
      updateOnlineDisplay(true);
    }
  }, 8000);
}
function updateOnlineDisplay(animate){
  if(!onlineCountEl) return;
  onlineCountEl.textContent = onlineBase.toLocaleString('es-GT');
  if(onlineSubtitleEl) onlineSubtitleEl.textContent = `${onlineBase.toLocaleString('es-GT')} personas escuchando ahora`;
  if(animate){
    onlineCountEl.classList.add('bump');
    setTimeout(()=>onlineCountEl.classList.remove('bump'), 250);
  }
}

audio.addEventListener('play',()=>{isPlaying=true;playerBar.classList.add('playing');playIcon.classList.add('hidden');pauseIcon.classList.remove('hidden');playerLiveText.textContent="EN VIVO";render();});
audio.addEventListener('pause',()=>{isPlaying=false;playerBar.classList.remove('playing');pauseIcon.classList.add('hidden');playIcon.classList.remove('hidden');playerLiveText.textContent=currentIndex>=0?"Pausado":"En espera";render();});
audio.addEventListener('waiting',()=>{playerLiveText.textContent="Cargando…";});audio.addEventListener('playing',()=>{playerLiveText.textContent="EN VIVO";});
document.getElementById('playPauseBtn').addEventListener('click',togglePlay);document.getElementById('nextBtn').addEventListener('click',nextStation);document.getElementById('prevBtn').addEventListener('click',prevStation);
document.getElementById('volumeRange').addEventListener('input',e=>setVolume(parseFloat(e.target.value)));searchInput.addEventListener('input',render);
document.querySelectorAll('.view-btn').forEach(btn=>{btn.addEventListener('click',()=>{viewMode=btn.dataset.view;localStorage.setItem('crg_view',viewMode);document.querySelectorAll('.view-btn').forEach(b=>{b.classList.toggle('active',b===btn);});render();});});
document.getElementById('favToggle').addEventListener('click',function(){showFavoritesOnly=!showFavoritesOnly;this.classList.toggle('on',showFavoritesOnly);render();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();togglePlay();}});
(function init(){const v=localStorage.getItem('crg_vol');if(v!==null)setVolume(parseFloat(v));else setVolume(1.0);playerLogo.src=svgFallback('CRG',getNeon(0));render();initOnlineCounter();})();
</script>
</body>
</html>
