<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Sonora HD</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0e1017;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #171925;
            padding: 35px 30px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card h2 {
            margin: 0 0 5px 0;
            color: #00e676;
            font-size: 1.4rem;
        }

        .status {
            font-size: 0.85rem;
            color: #8a8f9d;
            margin-bottom: 25px;
        }

        .play-btn {
            background-color: #00e676;
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }

        .play-btn:hover {
            background-color: #00c853;
            transform: scale(1.02);
        }

        audio { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Radio Sonora</h2>
        <p style="margin: 0 0 10px 0; color: #ccc; font-size: 0.9rem;">Transmisión en Vivo</p>
        <div id="status" class="status">Listo para conectar</div>

        <button id="playBtn" class="play-btn">▶ Escuchar En Vivo</button>
        <audio id="audioElement" crossorigin="anonymous"></audio>
    </div>

    <script>
        // Tunneling directo a través de proxy seguro para librar el HTTPS de Cloudflare Pages
        const targetUrl = 'http://190.56.85.14:8081/sonora/stream_abr/playlist.m3u8';
        const secureStream = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const status = document.getElementById('status');

        let hls = null;
        let isPlaying = false;

        function togglePlay() {
            if (!isPlaying) {
                status.innerText = "Conectando señal...";
                status.style.color = "#ffb74d";
                
                if (Hls.isSupported()) {
                    if (hls) hls.destroy();

                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true
                    });

                    hls.loadSource(secureStream);
                    hls.attachMedia(audio);

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        audio.play().then(() => {
                            isPlaying = true;
                            playBtn.innerText = "❚❚ Pausar";
                            status.innerText = "● EN VIVO";
                            status.style.color = "#00e676";
                        }).catch(() => {
                            status.innerText = "Haz clic de nuevo en Play";
                        });
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            status.innerText = "Error en la señal";
                            status.style.color = "#ff5252";
                        }
                    });
                } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                    audio.src = targetUrl;
                    audio.play();
                    isPlaying = true;
                    playBtn.innerText = "❚❚ Pausar";
                    status.innerText = "● EN VIVO";
                }
            } else {
                audio.pause();
                if (hls) hls.destroy();
                isPlaying = false;
                playBtn.innerText = "▶ Escuchar En Vivo";
                status.innerText = "Pausado";
                status.style.color = "#8a8f9d";
            }
        }

        playBtn.addEventListener('click', togglePlay);
    </script>

</body>
</html>
