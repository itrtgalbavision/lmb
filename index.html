<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streams CENTRAL DE RADIOS</title>

    <!-- HLS.js para reproducir M3U8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top, #1c2633 0%, #0d1117 45%, #080b0f 100%);

            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
        }

        /* ==============================
           PANEL PRINCIPAL
        ============================== */

        .container {
            width: 92%;
            max-width: 760px;

            padding: 35px;

            background: rgba(22, 27, 34, 0.94);

            border: 1px solid #30363d;
            border-radius: 20px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255,255,255,0.03);
        }

        h1 {
            text-align: center;
            margin: 0;

            font-size: 30px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;

            color: #8b949e;

            margin-top: 8px;
            margin-bottom: 30px;

            font-size: 14px;
        }

        /* ==============================
           RADIOS
        ============================== */

        .streams {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 16px;
        }

        .stream {
            position: relative;

            display: flex;
            align-items: center;

            min-height: 95px;

            padding: 15px 18px;

            background: linear-gradient(
                145deg,
                #21262d,
                #171b21
            );

            border: 1px solid #30363d;

            border-radius: 15px;

            color: white;

            overflow: hidden;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .stream::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 3px;

            background: #3fb950;

            opacity: 0.7;
        }

        .stream:hover {
            transform: translateY(-4px);

            border-color: #58a6ff;

            background: linear-gradient(
                145deg,
                #292f36,
                #1b222b
            );

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.35),
                0 0 20px rgba(88, 166, 255, 0.08);
        }

        .radio-icon {
            width: 65px;
            height: 65px;

            flex-shrink: 0;

            object-fit: contain;

            margin-right: 16px;

            border-radius: 12px;

            background: #0d1117;

            padding: 5px;

            border: 1px solid #30363d;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.35);

            transition: transform 0.25s ease;
        }

        .stream:hover .radio-icon {
            transform: scale(1.06);
        }

        .info {
            flex: 1;
        }

        .name {
            display: block;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 6px;
        }

        .type {
            display: block;

            color: #8b949e;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .status {
            width: 10px;
            height: 10px;

            flex-shrink: 0;

            margin-left: 10px;

            background: #3fb950;

            border-radius: 50%;

            box-shadow:
                0 0 8px rgba(63, 185, 80, 0.8);

            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0% {
                box-shadow: 0 0 5px rgba(63,185,80,0.5);
            }

            50% {
                box-shadow: 0 0 14px rgba(63,185,80,0.9);
            }

            100% {
                box-shadow: 0 0 5px rgba(63,185,80,0.5);
            }

        }

        .footer {
            margin-top: 25px;

            text-align: center;

            color: #6e7681;

            font-size: 12px;
        }


        /* ==================================================
           REPRODUCTOR
        ================================================== */

        .player-overlay {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at top,
                    #182431,
                    #080b0f 70%
                );

            padding: 20px;
        }

        .player-overlay.active {
            display: flex;
        }

        .player {

            width: 100%;
            max-width: 850px;

            background: rgba(22, 27, 34, 0.97);

            border: 1px solid #30363d;

            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.7);

            text-align: center;

            position: relative;
        }

        .close-player {

            position: absolute;

            top: 15px;
            right: 15px;

            width: 42px;
            height: 42px;

            border: 1px solid #30363d;

            border-radius: 50%;

            background: #21262d;

            color: white;

            font-size: 22px;

            cursor: pointer;

            transition: 0.2s;
        }

        .close-player:hover {

            background: #da3633;

            border-color: #da3633;

        }

        .player-logo {

            width: 140px;
            height: 140px;

            object-fit: contain;

            background: #0d1117;

            border-radius: 22px;

            padding: 10px;

            border: 1px solid #30363d;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.45);

            margin-bottom: 20px;
        }

        .player-name {

            margin: 0;

            font-size: 30px;

            letter-spacing: 1px;
        }

        .player-status {

            margin-top: 10px;

            color: #8b949e;

            font-size: 14px;
        }

        .live-dot {

            display: inline-block;

            width: 9px;
            height: 9px;

            background: #3fb950;

            border-radius: 50%;

            margin-right: 7px;

            box-shadow:
                0 0 10px #3fb950;
        }

        audio {

            width: 100%;

            margin-top: 30px;

            height: 55px;
        }

        .player-url {

            margin-top: 20px;

            color: #6e7681;

            font-size: 11px;

            word-break: break-all;
        }

        .fullscreen-btn {

            margin-top: 20px;

            padding: 12px 22px;

            border-radius: 10px;

            border: 1px solid #30363d;

            background: #21262d;

            color: white;

            cursor: pointer;

            transition: 0.2s;
        }

        .fullscreen-btn:hover {

            border-color: #58a6ff;

            background: #292f36;

        }


        /* ==================================================
           MOVIL
        ================================================== */

        @media (max-width: 600px) {

            body {
                align-items: flex-start;
                padding-top: 25px;
            }

            .container {

                width: 94%;

                padding: 25px 18px;

                border-radius: 18px;

            }

            h1 {
                font-size: 23px;
            }

            .subtitle {
                font-size: 12px;
                margin-bottom: 22px;
            }

            .streams {

                grid-template-columns: 1fr;

                gap: 12px;

            }

            .stream {

                min-height: 82px;

                padding: 12px 14px;

            }

            .radio-icon {

                width: 55px;
                height: 55px;

                margin-right: 13px;

            }

            .name {
                font-size: 16px;
            }

            .type {
                font-size: 10px;
            }

            /* Reproductor móvil */

            .player-overlay {

                padding: 0;

                align-items: stretch;

            }

            .player {

                max-width: none;

                min-height: 100vh;

                border-radius: 0;

                border: none;

                padding:

                    70px

                    25px

                    30px;

                display: flex;

                flex-direction: column;

                justify-content: center;

            }

            .close-player {

                top: 18px;
                right: 18px;

                width: 46px;
                height: 46px;

                font-size: 24px;

            }

            .player-logo {

                width: 160px;
                height: 160px;

                margin-left: auto;
                margin-right: auto;

            }

            .player-name {

                font-size: 28px;

            }

            audio {

                height: 55px;

                margin-top: 35px;

            }

            .fullscreen-btn {

                width: 100%;

                padding: 15px;

                font-size: 15px;

            }

            .player-url {

                display: none;

            }

        }
    </style>
</head>

<body>


    <!-- ==================================================
         PANEL PRINCIPAL
    ================================================== -->

    <div class="container">

        <h1>Streams CENTRAL DE RADIOS</h1>

        <div class="subtitle">
            Selecciona una estación para reproducir
        </div>


        <div class="streams">


            <!-- XTREMA -->

            <div class="stream"
                 onclick="abrirRadio(
                    'Xtrema',
                    'xtrema.png',
                    'http://190.56.85.14:8081/xtrema/stream_abr/playlist.m3u8'
                 )">

                <img
                    src="xtrema.png"
                    alt="Xtrema"
                    class="radio-icon"
                >

                <div class="info">

                    <span class="name">
                        Xtrema
                    </span>

                    <span class="type">
                        Streaming M3U8
                    </span>

                </div>

                <span class="status"></span>

            </div>


            <!-- LA MARCA -->

            <div class="stream"
                 onclick="abrirRadio(
                    'La Marca',
                    'lamarca.png',
                    'http://190.56.85.14:8081/lamarca/stream_abr/playlist.m3u8'
                 )">

                <img
                    src="lamarca.png"
                    alt="La Marca"
                    class="radio-icon"
                >

                <div class="info">

                    <span class="name">
                        La Marca
                    </span>

                    <span class="type">
                        Streaming M3U8
                    </span>

                </div>

                <span class="status"></span>

            </div>


            <!-- JOYA -->

            <div class="stream"
                 onclick="abrirRadio(
                    'Joya',
                    'joya.png',
                    'http://190.56.85.14:8081/joya/stream_abr/playlist.m3u8'
                 )">

                <img
                    src="joya.png"
                    alt="Joya"
                    class="radio-icon"
                >

                <div class="info">

                    <span class="name">
                        Joya
                    </span>

                    <span class="type">
                        Streaming M3U8
                    </span>

                </div>

                <span class="status"></span>

            </div>


            <!-- GALAXIA -->

            <div class="stream"
                 onclick="abrirRadio(
                    'Galaxia',
                    'galaxia.png',
                    'http://190.56.85.14:8081/galaxia/stream_abr/playlist.m3u8'
                 )">

                <img
                    src="galaxia.png"
                    alt="Galaxia"
                    class="radio-icon"
                >

                <div class="info">

                    <span class="name">
                        Galaxia
                    </span>

                    <span class="type">
                        Streaming M3U8
                    </span>

                </div>

                <span class="status"></span>

            </div>


            <!-- TROPICALIDA -->

            <div class="stream"
                 onclick="abrirRadio(
                    'Tropicalida',
                    'tropicalida.png',
                    'http://190.56.85.14:8081/tropicalida/stream_abr/playlist.m3u8'
                 )">

                <img
                    src="tropicalida.png"
                    alt="Tropicalida"
                    class="radio-icon"
                >

                <div class="info">

                    <span class="name">
                        Tropicalida
                    </span>

                    <span class="type">
                        Streaming M3U8
                    </span>

                </div>

                <span class="status"></span>

            </div>


            <!-- ALFA -->

            <div class="stream"
                 onclick="abrirRadio(
                    'Alfa',
                    'alfa.png',
                    'http://190.56.85.14:8081/alfa/stream_abr/playlist.m3u8'
                 )">

                <img
                    src="alfa.png"
                    alt="Alfa"
                    class="radio-icon"
                >

                <div class="info">

                    <span class="name">
                        Alfa
                    </span>

                    <span class="type">
                        Streaming M3U8
                    </span>

                </div>

                <span class="status"></span>

            </div>


        </div>


        <div class="footer">
            Panel de monitoreo · Streaming M3U8
        </div>

    </div>


    <!-- ==================================================
         REPRODUCTOR
    ================================================== -->

    <div
        id="playerOverlay"
        class="player-overlay"
    >

        <div class="player">


            <button
                class="close-player"
                onclick="cerrarRadio()"
                aria-label="Cerrar"
            >
                ×
            </button>


            <img
                id="playerLogo"
                class="player-logo"
                src=""
                alt=""
            >


            <h2
                id="playerName"
                class="player-name"
            >
                Radio
            </h2>


            <div
                id="playerStatus"
                class="player-status"
            >
                <span class="live-dot"></span>
                Preparando transmisión...
            </div>


            <audio
                id="audioPlayer"
                controls
                playsinline
            >
            </audio>


            <button
                class="fullscreen-btn"
                onclick="pantallaCompleta()"
            >
                ⛶ Pantalla completa
            </button>


            <div
                id="playerUrl"
                class="player-url"
            >
            </div>


        </div>

    </div>


    <script>

        let hls = null;


        /* ==================================================
           ABRIR RADIO
        ================================================== */

        function abrirRadio(nombre, logo, url) {

            const overlay =
                document.getElementById("playerOverlay");

            const playerLogo =
                document.getElementById("playerLogo");

            const playerName =
                document.getElementById("playerName");

            const playerStatus =
                document.getElementById("playerStatus");

            const audio =
                document.getElementById("audioPlayer");

            const playerUrl =
                document.getElementById("playerUrl");


            /* Mostrar reproductor */

            overlay.classList.add("active");


            /* Información */

            playerLogo.src = logo;

            playerLogo.alt = nombre;

            playerName.textContent = nombre;

            playerUrl.textContent = url;

            playerStatus.innerHTML =
                '<span class="live-dot"></span>' +
                'Conectando con la transmisión...';


            /* Detener reproducción anterior */

            if (hls) {

                hls.destroy();

                hls = null;

            }

            audio.pause();

            audio.removeAttribute("src");

            audio.load();


            /* ==================================================
               HLS.JS
            ================================================== */

            if (Hls.isSupported()) {

                hls = new Hls({

                    enableWorker: true,

                    lowLatencyMode: true,

                    backBufferLength: 30

                });


                hls.loadSource(url);

                hls.attachMedia(audio);


                hls.on(
                    Hls.Events.MANIFEST_PARSED,
                    function() {

                        playerStatus.innerHTML =
                            '<span class="live-dot"></span>' +
                            'EN VIVO · Conectado';

                        audio.play()
                            .catch(() => {

                                playerStatus.innerHTML =
                                    '<span class="live-dot"></span>' +
                                    'Listo para reproducir';

                            });

                    }
                );


                hls.on(
                    Hls.Events.ERROR,
                    function(event, data) {

                        if (data.fatal) {

                            playerStatus.innerHTML =
                                '⚠ No se pudo conectar con la transmisión';

                        }

                    }
                );

            }

            /* ==================================================
               SAFARI / IOS
            ================================================== */

            else if (
                audio.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            ) {

                audio.src = url;

                audio.addEventListener(
                    "loadedmetadata",
                    function() {

                        playerStatus.innerHTML =
                            '<span class="live-dot"></span>' +
                            'EN VIVO · Conectado';

                        audio.play()
                            .catch(() => {});

                    },
                    { once: true }
                );

            }

            else {

                playerStatus.innerHTML =
                    "⚠ Este navegador no soporta reproducción HLS.";

            }

        }


        /* ==================================================
           CERRAR RADIO
        ================================================== */

        function cerrarRadio() {

            const overlay =
                document.getElementById("playerOverlay");

            const audio =
                document.getElementById("audioPlayer");


            audio.pause();

            audio.removeAttribute("src");

            audio.load();


            if (hls) {

                hls.destroy();

                hls = null;

            }


            overlay.classList.remove("active");

        }


        /* ==================================================
           PANTALLA COMPLETA
        ================================================== */

        function pantallaCompleta() {

            const player =
                document.querySelector(".player");


            if (player.requestFullscreen) {

                player.requestFullscreen();

            }

            else if (player.webkitRequestFullscreen) {

                player.webkitRequestFullscreen();

            }

        }


        /* ==================================================
           ESCAPE PARA CERRAR
        ================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    cerrarRadio();

                }

            }
        );

    </script>

</body>
</html>
