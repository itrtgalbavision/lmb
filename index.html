<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radio Sonora</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="background:#121212; color:white; font-family:sans-serif; text-align:center; padding-top:50px;">

    <h2>Radio Sonora - En Vivo</h2>
    <audio id="radio" controls style="width: 300px; margin-top:20px;"></audio>
    <p id="status" style="color: #aaa; font-size: 14px; margin-top: 10px;"></p>

    <script>
        const url = 'http://190.56.85.14:8081/sonora/stream_abr/playlist.m3u8';
        const audio = document.getElementById('radio');
        const status = document.getElementById('status');

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(audio);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                status.innerText = "Señal lista. Haz clic en Play.";
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    status.innerText = "Error: El servidor de la radio no responde o el puerto 8081 está bloqueado.";
                    status.style.color = "#ff5555";
                }
            });
        } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
            audio.src = url;
        }
    </script>
</body>
</html>
