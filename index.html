<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Sonora - En Vivo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 320px;
        }

        .player-card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #4caf50;
        }

        .btn-stream {
            display: inline-block;
            background-color: #4caf50;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn-stream:hover {
            background-color: #45a049;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        .note {
            font-size: 0.8rem;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Transmisión en Vivo</h2>
        <p style="margin: 5px 0;">Radio Sonora</p>

        <!-- Opción 1: Reproductor Directo de Audio HTML5 -->
        <audio controls preload="none">
            <source src="http://192.168.155.83:8081/sonora/stream_abr/playlist.m3u8" type="application/x-mpegURL">
            <source src="http://192.168.155.83:8081/sonora/stream_abr/playlist.m3u8" type="audio/mpeg">
            Tu navegador no soporta reproducción directa.
        </audio>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <!-- Opción 2: Enlace directo (By-pass completo de restricciones CORS) -->
        <p style="font-size: 0.9rem;">¿No reproduce en tu navegador?</p>
        <a href="http://192.168.155.83:8081/sonora/stream_abr/playlist.m3u8" class="btn-stream" target="_blank">
            Abrir Stream Directo
        </a>

        <div class="note">
            Nota: Si la página web está alojada en HTTPS, debes usar la opción de "Abrir Stream Directo" o abrir este archivo HTML localmente desde tu equipo.
        </div>
    </div>

</body>
</html>
